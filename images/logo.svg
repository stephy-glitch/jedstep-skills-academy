<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <!-- Simplified J with plane -->
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D4B340"/>
      <stop offset="100%" style="stop-color:#A8841F"/>
    </linearGradient>
  </defs>
  <!-- J shape -->
  <path d="M110 20 L110 140 Q110 180 70 180 Q40 180 40 150" fill="none" stroke="url(#gold)" stroke-width="28" stroke-linecap="round"/>
  <rect x="95" y="20" width="30" height="50" fill="url(#gold)" rx="2"/>
  <!-- Curve base -->
  <path d="M30 150 Q50 190 100 180 Q140 170 150 140" fill="none" stroke="#8B6914" stroke-width="18" stroke-linecap="round"/>
  <!-- Flight path -->
  <path d="M50 160 Q100 100 150 40" fill="none" stroke="#1A3A5C" stroke-width="4"/>
  <!-- Plane -->
  <g transform="translate(145,30) rotate(35)">
    <path d="M0 0 L25 -5 L30 0 L25 5 Z" fill="#1A3A5C"/>
    <path d="M5 -8 L15 -3 L5 2 Z" fill="#1A3A5C"/>
    <path d="M5 8 L15 3 L5 -2 Z" fill="#1A3A5C"/>
  </g>
  <!-- Text -->
  <text x="100" y="210" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#8B6914">ED STEP</text>
</svg>
